services:
  - type: web
    name: aether-brain
    env: python
    buildCommand: "pip install -r requirements.txt"
    startCommand: "python3 -m uvicorn main:app --host 0.0.0.0 --port $PORT --loop asyncio"
    envVars:
      - key: GEMINI_API_KEY
        sync: false
      - key: DATABASE_URL
        sync: false
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_KEY
        sync: false
      - key: REDIS_URL
        sync: false
      - key: WANDB_API_KEY
        sync: false
      - key: WANDB_MODE
        value: disabled
      - key: ENVIRONMENT
        value: production
